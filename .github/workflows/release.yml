name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/v}"
            VER=$(echo "$VER" | sed 's/^v//')
            if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF" ]; then
              VER=$(cat VERSION | tr -d ' \n\r' | sed 's/^v//')
            fi
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
          echo "Release version: $VER"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest ruff
          pip install -e .

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest -q

      - name: Generate version info
        run: python tools/generate_version_info.py

      - name: Build exe (fixed launcher)
        run: |
          pyinstaller --name DetectiveBlackville --onedir --windowed --clean --noconfirm `
            --paths src `
            --hidden-import detective_game `
            --hidden-import detective_game.main `
            --hidden-import detective_game.config `
            --hidden-import detective_game.data `
            --hidden-import detective_game.game_state `
            --hidden-import detective_game.save_system `
            --hidden-import detective_game.updater `
            --hidden-import detective_game.ui.widgets `
            --collect-all pygame `
            --collect-all detective_game `
            --hidden-import requests `
            --hidden-import certifi `
            --hidden-import urllib3 `
            --collect-data certifi `
            --add-data "src/detective_game/assets;detective_game/assets" `
            --add-data "src/detective_game/cases;detective_game/cases" `
            --add-data "VERSION;." `
            --add-data "VERSION;detective_game" `
            --hidden-import detective_game._build_version `
            --icon "src/detective_game/assets/images/icon.ico" `
            --version-file build_version_info.txt `
            --manifest build_app.manifest `
            launcher.py
          dir dist

      - name: Verify certifi CA bundle is bundled (защита от SSL-ошибок апдейтера)
        shell: pwsh
        run: |
          $root = "dist/DetectiveBlackville"
          $cacert = Get-ChildItem -Path $root -Recurse -Filter "cacert.pem" -ErrorAction SilentlyContinue
          if (-not $cacert) {
            Write-Warning "cacert.pem не найден в сборке — апдейтер переключится на системные сертификаты Windows (urllib)"
          } else {
            foreach ($f in $cacert) { Write-Host "CA bundle: $($f.FullName) ($($f.Length) bytes)" }
          }

      - name: Create latest.json
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cat > dist/latest.json <<EOF
          {
            "version": "$VERSION",
            "tag": "v$VERSION",
            "url": "https://github.com/ignatus4405-glitch/detective_game/releases/tag/v$VERSION",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Release $VERSION — Детектив: Блэквил"
          }
          EOF
          cat dist/latest.json

      - name: Create release notes
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            echo "# Детектив: Блэквил v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            awk "/## \[$VERSION\]/ {flag=1; next} /## \[/ {flag=0} flag" CHANGELOG.md | head -n 50 >> release_notes.md || echo "Релиз $VERSION" >> release_notes.md
          else
            echo "Release $VERSION — Детектив: Блэквил" > release_notes.md
          fi
          cat release_notes.md

      - name: Verify VERSION is bundled (защита от вечного баннера обновления)
        shell: pwsh
        run: |
          $root = "dist/DetectiveBlackville"
          $candidates = @(
            "$root/_internal/VERSION",
            "$root/_internal/detective_game/VERSION",
            "$root/VERSION"
          )
          $found = $candidates | Where-Object { Test-Path $_ }
          if (-not $found) {
            Write-Error "VERSION не попал в PyInstaller-сборку — игра снова будет считать себя 0.1.0"
            Get-ChildItem $root -Force | Format-Table Name
            exit 1
          }
          foreach ($f in $found) {
            Write-Host "$f -> $((Get-Content $f -Raw).Trim())"
          }

      - name: Generate README and hashes
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          python tools/make_readme.py
          $exePath = if (Test-Path dist/DetectiveBlackville/DetectiveBlackville.exe) { "dist/DetectiveBlackville/DetectiveBlackville.exe" } elseif (Test-Path dist/DetectiveBlackville.exe) { "dist/DetectiveBlackville.exe" } else { $null }
          if ($exePath -and (Test-Path $exePath)) {
            $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash
            "SHA256: $hash  DetectiveBlackville.exe" | Out-File -Encoding utf8 dist/SHA256SUMS.txt
            Write-Host "SHA256: $hash"
          } else {
            Write-Warning "Exe missing for hash"
            "SHA256: unavailable" | Out-File -Encoding utf8 dist/SHA256SUMS.txt
          }
          if (Test-Path dist/latest.json) { Get-Content dist/latest.json }
          if (Test-Path dist/SHA256SUMS.txt) { Get-Content dist/SHA256SUMS.txt }
          if (Test-Path dist/README.txt) { Write-Host "README.txt ready" }
          dir dist

      - name: Zip artifacts (onedir)
        run: |
          $ErrorActionPreference = "Continue"
          if (Test-Path dist/DetectiveBlackville) {
            if (Test-Path dist/latest.json) { Copy-Item dist/latest.json dist/DetectiveBlackville/ -Force }
            if (Test-Path dist/SHA256SUMS.txt) { Copy-Item dist/SHA256SUMS.txt dist/DetectiveBlackville/ -Force }
            if (Test-Path dist/README.txt) { Copy-Item dist/README.txt dist/DetectiveBlackville/ -Force }
            Compress-Archive -Path dist/DetectiveBlackville -DestinationPath DetectiveBlackville-Windows.zip -Force
            Compress-Archive -Path dist/DetectiveBlackville -DestinationPath DetectiveBlackville-Full.zip -Force
          } else {
            $files1 = @("dist/DetectiveBlackville.exe") | Where-Object { Test-Path $_ }
            Compress-Archive -Path $files1 -DestinationPath DetectiveBlackville-Windows.zip -Force
            $files2 = @("dist/DetectiveBlackville.exe", "dist/latest.json", "dist/SHA256SUMS.txt", "dist/README.txt") | Where-Object { Test-Path $_ }
            Compress-Archive -Path $files2 -DestinationPath DetectiveBlackville-Full.zip -Force
          }
          dir *.zip

      - name: Install Inno Setup
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2

      - name: Build installer
        continue-on-error: true
        shell: powershell
        run: |
          $VERSION="${{ steps.ver.outputs.version }}"
          $env:VERSION=$VERSION
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc=(Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc -or -not (Test-Path $iscc)) { Write-Warning "ISCC not found, skip installer"; exit 0 }
          Write-Host "ISCC path: $iscc"; Get-Item $iscc | Format-List
          & $iscc "/DVERSION=$VERSION" "tools/installer.iss"
          Write-Host "ISCC exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Warning "ISCC exit $LASTEXITCODE"; exit 0 }
          dir Output | Format-Table Name,Length
          # Проверяем оба возможных пути (Output в корне и tools/Output из-за OutputDir)
          $instPath = $null
          foreach ($cand in @("Output/DetectiveBlackville-Setup-$VERSION.exe", "tools/Output/DetectiveBlackville-Setup-$VERSION.exe")) {
            if (Test-Path $cand) { $instPath = $cand; break }
          }
          if ($instPath) {
            if ($instPath -ne "Output/DetectiveBlackville-Setup-$VERSION.exe") { New-Item -ItemType Directory -Force -Path Output | Out-Null; Copy-Item $instPath -Destination "Output/DetectiveBlackville-Setup-$VERSION.exe" -Force }
            $hashInst=(Get-FileHash "Output/DetectiveBlackville-Setup-$VERSION.exe" -Algorithm SHA256).Hash
            "$hashInst  DetectiveBlackville-Setup-$VERSION.exe" | Out-File -Append -Encoding utf8 dist/SHA256SUMS.txt
            Write-Host "Installer built: $instPath -> Output/DetectiveBlackville-Setup-$VERSION.exe ($hashInst)"
          } else {
            Write-Warning "Installer exe not found in Output/ or tools/Output/"
            dir Output -ErrorAction SilentlyContinue | Format-Table Name,Length
            dir tools/Output -ErrorAction SilentlyContinue | Format-Table Name,Length
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Детектив: Блэквил v${{ steps.ver.outputs.version }}"
          body_path: release_notes.md
          files: |
            DetectiveBlackville-Windows.zip
            DetectiveBlackville-Full.zip
            Output/DetectiveBlackville-Setup-*.exe
            tools/Output/DetectiveBlackville-Setup-*.exe
            dist/latest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
