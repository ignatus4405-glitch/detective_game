name: Build

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check version sync
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d ' \n\r' | sed 's/^v//')
          PYPROJECT=$(grep -oP 'version = "\K[^"]+' pyproject.toml | head -1)
          echo "VERSION=$VERSION pyproject=$PYPROJECT"
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::Version mismatch"
            exit 1
          fi

      - name: Run tests
        run: pytest -q

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --name DetectiveBlackville --onefile --windowed --clean --noconfirm `
            --add-data "src/detective_game/assets;detective_game/assets" `
            --add-data "src/detective_game/cases;detective_game/cases" `
            --hidden-import pygame `
            --collect-all pygame `
            src/detective_game/main.py
          dir dist

      - name: Create latest.json
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d ' \n\r' | sed 's/^v//')
          cat > dist/latest.json <<EOF
          {
            "version": "$VERSION",
            "tag": "v$VERSION",
            "url": "https://github.com/ignatus4405-glitch/detective_game/releases/tag/v$VERSION",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Auto-build from $GITHUB_SHA"
          }
          EOF
          cat dist/latest.json

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist/DetectiveBlackville.exe,dist/latest.json -DestinationPath DetectiveBlackville-Windows.zip -Force
          dir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetectiveBlackville-Windows
          path: DetectiveBlackville-Windows.zip
          retention-days: 30

      - name: Upload latest.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: dist/latest.json
