name: Build

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest ruff
          pip install -e .

      - name: Check version sync
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d ' \n\r' | sed 's/^v//')
          PYPROJECT=$(grep -oP 'version = "\K[^"]+' pyproject.toml | head -1)
          echo "VERSION=$VERSION pyproject=$PYPROJECT"
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::Version mismatch"
            exit 1
          fi

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest -q

      - name: Generate version info
        run: python tools/generate_version_info.py

      - name: Build exe with PyInstaller (fixed launcher)
        run: |
          pyinstaller --name DetectiveBlackville --onefile --windowed --clean --noconfirm `
            --paths src `
            --hidden-import detective_game `
            --hidden-import detective_game.main `
            --hidden-import detective_game.config `
            --hidden-import detective_game.data `
            --hidden-import detective_game.game_state `
            --hidden-import detective_game.save_system `
            --hidden-import detective_game.updater `
            --hidden-import detective_game.ui.widgets `
            --collect-all pygame `
            --collect-all detective_game `
            --add-data "src/detective_game/assets;detective_game/assets" `
            --add-data "src/detective_game/cases;detective_game/cases" `
            --icon "src/detective_game/assets/images/icon.ico" `
            --version-file build_version_info.txt `
            --manifest build_app.manifest `
            launcher.py
          dir dist
          if (-not (Test-Path dist/DetectiveBlackville.exe)) { throw "Build failed" }

      - name: Generate README and hashes
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          python tools/make_readme.py
          if (Test-Path dist/DetectiveBlackville.exe) {
            $hash = (Get-FileHash dist/DetectiveBlackville.exe -Algorithm SHA256).Hash
            "SHA256: $hash  DetectiveBlackville.exe" | Out-File -Encoding utf8 dist/SHA256SUMS.txt
            Write-Host "SHA256: $hash"
          } else {
            Write-Warning "Exe not found for hashing"
            "SHA256: unavailable" | Out-File -Encoding utf8 dist/SHA256SUMS.txt
          }
          if (Test-Path dist/SHA256SUMS.txt) { Get-Content dist/SHA256SUMS.txt }
          if (Test-Path dist/README.txt) { Write-Host "README.txt exists" }

      - name: Create latest.json
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d ' \n\r' | sed 's/^v//')
          cat > dist/latest.json <<EOF
          {
            "version": "$VERSION",
            "tag": "v$VERSION",
            "url": "https://github.com/ignatus4405-glitch/detective_game/releases/tag/v$VERSION",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Auto-build from $GITHUB_SHA"
          }
          EOF
          cat dist/latest.json

      - name: Zip artifact
        run: |
          $ErrorActionPreference = "Continue"
          $files = @("dist/DetectiveBlackville.exe", "dist/latest.json", "dist/SHA256SUMS.txt", "dist/README.txt") | Where-Object { Test-Path $_ }
          if ($files.Count -eq 0) { throw "No files to zip" }
          Compress-Archive -Path $files -DestinationPath DetectiveBlackville-Windows.zip -Force
          dir DetectiveBlackville-Windows.zip

      - name: Install Inno Setup (for installer)
        continue-on-error: true
        shell: powershell
        run: |
          choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { Write-Host "choco innosetup failed, trying scoop fallback" }
          $iscc = Get-Command "iscc" -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "ISCC found at $($iscc.Source)" } else { Write-Host "ISCC not on PATH, checking default locations"; if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { Write-Host "Found at default" } }

      - name: Build Windows installer (Inno Setup)
        continue-on-error: true
        shell: powershell
        run: |
          $VERSION = (Get-Content VERSION | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" } | Select-Object -First 1).TrimStart('v')
          Write-Host "Building installer for v$VERSION"
          $env:VERSION = $VERSION
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc -or -not (Test-Path $iscc)) { Write-Warning "ISCC not found, skipping installer build"; exit 0 }
          & $iscc "/DVERSION=$VERSION" "tools/installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Warning "ISCC failed with $LASTEXITCODE"; exit 0 }
          if (Test-Path "Output/DetectiveBlackville-Setup-$VERSION.exe") {
            $size = (Get-Item "Output/DetectiveBlackville-Setup-$VERSION.exe").Length / 1MB
            Write-Host "Installer built: Output/DetectiveBlackville-Setup-$VERSION.exe ($([math]::Round($size,1)) MB)"
            $hash2 = (Get-FileHash "Output/DetectiveBlackville-Setup-$VERSION.exe" -Algorithm SHA256).Hash
            "$hash2  DetectiveBlackville-Setup-$VERSION.exe" | Out-File -Append -Encoding utf8 dist/SHA256SUMS.txt
          } else {
            Write-Warning "Installer exe not found in Output/"
            dir Output -ErrorAction SilentlyContinue | Format-Table Name,Length
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetectiveBlackville-Windows
          path: DetectiveBlackville-Windows.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DetectiveBlackville-Installer
          path: Output/DetectiveBlackville-Setup-*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload latest.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: dist/latest.json
