[project]
name = "detective-game-blackville"
version = "0.1.6"
description = "Детективная игра в стиле нуар 80-х — интерактивное расследование по мотивам 'Код Города'. Windows, Pygame."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blackville Studio", email = "ignatus.4405@gmail.com"}]
keywords = ["detective", "noir", "game", "pygame", "visual-novel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "pygame>=2.5.0",
  "requests>=2.31.0",
]
[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
  "pyinstaller>=6.0",
  "pillow>=10.0",
]
[project.urls]
Homepage = "https://github.com/ignatus4405-glitch/detective_game"
Repository = "https://github.com/ignatus4405-glitch/detective_game"
Issues = "https://github.com/ignatus4405-glitch/detective_game/issues"
Releases = "https://github.com/ignatus4405-glitch/detective_game/releases"

[project.scripts]
detective-game = "detective_game.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detective_game = ["assets/**/*", "cases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","I","B"]
ignore = ["E501", "F405", "F403", "F401", "E402", "E712", "E741", "B007", "F841", "E701"]

[tool.ruff.lint.per-file-ignores]
"src/detective_game/main.py" = ["F405", "F403", "F841", "E741", "B007", "E712"]
"src/detective_game/config.py" = ["F401"]
"src/detective_game/game_state.py" = ["F401", "I001"]
"src/detective_game/data.py" = ["F401"]
"tests/*" = ["E712", "F401", "F841"]
